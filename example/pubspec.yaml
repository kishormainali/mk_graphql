name: example
description: Complete SpaceX Flutter example for mk_graphql with auto_route and injectable.
version: 1.0.0
publish_to: none

resolution: workspace

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.1
  mk_graphql: ^1.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  auto_route: ^11.1.0
  injectable: ^3.0.0
  get_it: ^9.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  mk_graphql_generator: ^1.0.0
  build_runner: ^2.16.1
  auto_route_generator: ^10.6.0
  injectable_generator: ^3.1.3
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  flutter_lints: ^6.0.0
