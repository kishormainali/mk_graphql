name: CI (mk_graphql_generator)

on:
  push:
    # Branches only. Tag pushes are releases; publish-mk_graphql_generator.yml
    # verifies the tagged package on its own.
    branches: ['**']
    paths:
      - 'packages/mk_graphql_generator/**'
      - 'pubspec.yaml'
      - '.github/workflows/ci-mk_graphql_generator.yml'
  pull_request:
    paths:
      - 'packages/mk_graphql_generator/**'
      - 'pubspec.yaml'
      - '.github/workflows/ci-mk_graphql_generator.yml'

concurrency:
  group: ci-mk_graphql_generator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Format, analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The workspace also contains Flutter packages, so resolving it needs
      # Flutter's pub (which bundles a full Dart SDK).
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter --version

      - name: Install workspace dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed packages/mk_graphql_generator

      - name: Analyze
        working-directory: packages/mk_graphql_generator
        run: dart analyze --fatal-infos

      - name: Test
        working-directory: packages/mk_graphql_generator
        run: dart test
