name: mk_graphql
description: A clean, modern, simplified GraphQL client for Dart & Flutter with normalized caching, composable links, and stream-based operation execution.
version: 1.2.3

homepage: https://github.com/kishormainali/mk_graphql
repository: https://github.com/kishormainali/mk_graphql/tree/main/packages/mk_graphql
issue_tracker: https://github.com/kishormainali/mk_graphql/issues

topics:
  - graphql
  - flutter
  - client
  - sse
  - dio

resolution: workspace

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.1
  gql: ^1.0.1
  gql_exec: ^1.0.0+1
  gql_link: ^1.1.0
  web_socket_channel: ^3.0.3
  async: ^2.13.1
  meta: ^1.15.0
  collection: ^1.19.0
  hive_ce: ^2.20.0
  token_storage: ^1.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
  flutter_secure_storage: ^11.2.0
  flutter_secure_storage_platform_interface: ^2.1.1
  shared_preferences_platform_interface: ^2.4.1
