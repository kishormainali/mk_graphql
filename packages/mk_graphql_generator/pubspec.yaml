name: mk_graphql_generator
description: Fast build_runner generator for mk_graphql. Generates Freezed data models, operations, variables, fragments, and combiner queries into .gql.dart files.
version: 1.2.1-dev.3

homepage: https://github.com/kishormainali/mk_graphql
repository: https://github.com/kishormainali/mk_graphql/tree/main/packages/mk_graphql_generator
issue_tracker: https://github.com/kishormainali/mk_graphql/issues

topics:
  - graphql
  - code-generation
  - freezed
  - build-runner
  - generator

resolution: workspace

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  build: ^4.0.11
  code_builder: ^4.12.0
  gql: ^1.0.1
  path: ^1.9.0
  recase: ^4.1.0
  dart_style: ^3.1.13
  yaml: ^3.1.4
  crypto: ^3.0.3
  args: ^2.6.0
  http: ^1.3.0

dev_dependencies:
  build_runner: ^2.16.1
  test: ^1.24.0
  lints: ^6.1.0
