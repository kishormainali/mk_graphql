type Query {
  Page(page: Int, perPage: Int): Page
  Media(id: Int, type: MediaType): Media
  GenreCollection: [String]
}

type Page {
  pageInfo: PageInfo

  media(
    id: Int
    search: String
    type: MediaType
    sort: [MediaSort]
    genre: String
  ): [Media]
}

type PageInfo {
  total: Int
  perPage: Int
  currentPage: Int
  lastPage: Int
  hasNextPage: Boolean
}

type Media {
  id: Int!
  title: MediaTitle
  coverImage: MediaCoverImage
  bannerImage: String
  description(asHtml: Boolean): String
  genres: [String]
  averageScore: Int
  episodes: Int
  duration: Int
  status: MediaStatus
  format: MediaFormat
  season: MediaSeason
  seasonYear: Int
  popularity: Int
  favourites: Int
}

type MediaTitle {
  romaji: String
  english: String
  native: String
}

type MediaCoverImage {
  extraLarge: String
  large: String
  medium: String
  color: String
}

enum MediaType {
  ANIME
  MANGA
}

enum MediaSort {
  ID
  ID_DESC
  TITLE_ROMAJI
  TITLE_ROMAJI_DESC
  TITLE_ENGLISH
  TITLE_ENGLISH_DESC
  TITLE_NATIVE
  TITLE_NATIVE_DESC
  TYPE
  TYPE_DESC
  FORMAT
  FORMAT_DESC
  START_DATE
  START_DATE_DESC
  END_DATE
  END_DATE_DESC
  SCORE
  SCORE_DESC
  POPULARITY
  POPULARITY_DESC
  TRENDING
  TRENDING_DESC
  EPISODES
  EPISODES_DESC
  DURATION
  DURATION_DESC
  STATUS
  STATUS_DESC
  UPDATED_AT
  UPDATED_AT_DESC
  SEARCH_MATCH
  FAVOURITES
  FAVOURITES_DESC
}

enum MediaStatus {
  FINISHED
  RELEASING
  NOT_YET_RELEASED
  CANCELLED
  HIATUS
}

enum MediaFormat {
  TV
  TV_SHORT
  MOVIE
  SPECIAL
  OVA
  ONA
  MUSIC
  MANGA
  NOVEL
  ONE_SHOT
}

enum MediaSeason {
  WINTER
  SPRING
  SUMMER
  FALL
}
