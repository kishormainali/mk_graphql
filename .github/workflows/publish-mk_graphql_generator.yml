name: Publish mk_graphql_generator to pub.dev

# Tag format: mk_graphql_generator-v<version>, e.g. mk_graphql_generator-v1.5.0
#             (pre-releases: mk_graphql_generator-v1.6.0-beta.1)
# On pub.dev (package admin > Automated publishing > GitHub Actions):
#   repository: kishormainali/mk_graphql
#   tag pattern: mk_graphql_generator-v{{version}}
#   environment: pub.dev
# Create tags with scripts/release.sh.
on:
  push:
    tags:
      - 'mk_graphql_generator-v[0-9]+.[0-9]+.[0-9]+'
      - 'mk_graphql_generator-v[0-9]+.[0-9]+.[0-9]+-*'

env:
  PACKAGE_DIR: packages/mk_graphql_generator

jobs:
  # 1. Check the tag against the package's pubspec version
  validate-version:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches pubspec version
        id: tag
        run: |
          VERSION="${GITHUB_REF_NAME##*-v}"
          PUBSPEC_VERSION="$(grep '^version:' "$PACKAGE_DIR/pubspec.yaml" | awk '{print $2}')"
          echo "tag: $VERSION  pubspec: $PUBSPEC_VERSION"
          if [ "$VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "Tag version ($VERSION) does not match $PACKAGE_DIR/pubspec.yaml ($PUBSPEC_VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # 2. Verify before publishing
  test:
    name: Verify tests
    runs-on: ubuntu-latest
    needs: validate-version
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed "$PACKAGE_DIR"

      - name: Analyze
        working-directory: ${{ env.PACKAGE_DIR }}
        run: dart analyze --fatal-infos

      - name: Run tests
        working-directory: ${{ env.PACKAGE_DIR }}
        run: dart test

  # 3. Publish using OIDC (no stored credentials)
  publish:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    needs: [validate-version, test]

    # Must match the environment configured under:
    #   pub.dev package admin > Automated publishing > GitHub Actions
    environment: pub.dev

    permissions:
      id-token: write # Required for OIDC token exchange with pub.dev
      contents: read

    steps:
      - uses: actions/checkout@v5

      # Provisions the OIDC token pub.dev needs (exported as PUB_TOKEN). Must run
      # BEFORE the Flutter step: the Flutter SDK's `dart` shadows this one but
      # reuses the token.
      - name: Set up Dart and pub.dev OIDC token
        uses: dart-lang/setup-dart@v1

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - run: flutter pub get

      - name: Publish - dry run
        working-directory: ${{ env.PACKAGE_DIR }}
        run: dart pub publish --dry-run

      - name: Publish
        working-directory: ${{ env.PACKAGE_DIR }}
        run: dart pub publish --force

  # 4. Create a GitHub Release for the tag
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate-version, publish]

    permissions:
      contents: write # Required to create a release via GITHUB_TOKEN

    steps:
      - uses: actions/checkout@v5

      # Pulls this version's section out of the package's CHANGELOG.md.
      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          awk -v ver="$VERSION" '
            /^## / {
              if (found) exit
              if ($0 == "## " ver || $0 == "## [" ver "]") { found=1; next }
              next
            }
            found { print }
          ' "$PACKAGE_DIR/CHANGELOG.md" | sed '/^---$/d' > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "_No CHANGELOG.md entry found for $VERSION._" > release_notes.md
          fi
          cat release_notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          # Anything with a `-` after the version (e.g. -beta.1) is a pre-release.
          prerelease: ${{ contains(needs.validate-version.outputs.version, '-') }}
