name: Publish mk_graphql_generator to pub.dev

on:
  push:
    tags:
      - 'mk_graphql_generator-v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  id-token: write # Required for pub.dev OIDC authentication
  contents: read

jobs:
  publish:
    name: Publish Package
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for pub.dev OIDC authentication
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # mk_graphql_generator is pure Dart, but it's a member of a workspace
      # that also contains the Flutter-dependent mk_graphql package and the
      # example app, so resolving the workspace requires Flutter's pub.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Dart (for OIDC auth with pub.dev)
        uses: dart-lang/setup-dart@v1

      - name: Install workspace dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed packages/mk_graphql_generator

      - name: Analyze code
        working-directory: packages/mk_graphql_generator
        run: dart analyze --fatal-infos

      - name: Run tests
        working-directory: packages/mk_graphql_generator
        run: dart test

      - name: Publish to pub.dev
        working-directory: packages/mk_graphql_generator
        run: dart pub publish --force
